# Noteworthy: what the feed scraper reads and what it looks for.  `python -m buildout feeds --out site/data`
#
# tier: official (primary data), niche (few readers, early), specialist (expert newsletters and analysts),
#       mainstream (wires and large accounts). The asymmetry score is high when a theme lives in the first three
#       before the fourth notices.
# X is read only through the official API (set the X_BEARER_TOKEN secret); without it, X sources are skipped.
# Telegram public channels are read from their web preview, t.me/s/<channel>, which needs no login.

