# Themes: each is matched against titles and text, case-insensitively, on whole words. `query` is what the
# scraper sends to X recent search and Google News (the mainstream baseline) for that theme.

[[theme]]
id = "oil-physical"
name = "Physical oil premium"
terms = ["dated brent", "hormuz", "backwardation", "tanker", "physical premium", "crude draw"]
query = "\"dated brent\" OR hormuz OR backwardation"
desk = "nw-oil-physical"

[[theme]]
id = "fed-hike"
name = "Fed second hike"
terms = ["rate hike", "fomc", "hawkish", "waller", "williams", "fed funds"]
query = "FOMC hike October"
desk = "nw-fed-hike"

[[theme]]
id = "private-credit"
name = "Private credit gates"
terms = ["bdc", "redemption", "gated", "pik", "payment in kind", "non-accrual", "bcred", "private credit"]
query = "BDC redemptions OR \"private credit\" gate"
desk = "nw-private-credit"

[[theme]]
id = "memory"
name = "Memory supercycle"
terms = ["hbm", "dram", "ddr5", "memory prices", "sk hynix", "micron", "nand"]
query = "HBM OR DRAM contract prices"
desk = "nw-memory"

[[theme]]
id = "power"
name = "Grid power ceiling"
terms = ["pjm", "capacity auction", "interconnection", "data center power", "gas turbine", "megawatt"]
query = "PJM capacity OR \"data center power\""
desk = "nw-power"

[[theme]]
id = "depreciation"
name = "GPU useful-life reset"
terms = ["useful life", "depreciation", "impairment", "gpu life", "server life"]
query = "GPU \"useful life\" depreciation"
desk = "nw-depreciation"

[[theme]]
id = "market-structure"
name = "Market structure shift"
terms = ["0dte", "off-exchange", "payment for order flow", "internalization", "market maker", "dark pool"]
query = "0DTE OR \"off-exchange\" OR \"market maker\""
desk = "nw-market-structure"

[[theme]]
id = "pods"
name = "Pod shop costs and crowding"
terms = ["multi-manager", "multistrategy", "pass-through", "pod", "millennium", "citadel", "balyasny"]
query = "multistrategy hedge fund pass-through"
desk = "nw-pods"

[[theme]]
id = "consumer"
name = "Consumer strain"
terms = ["consumer sentiment", "umich", "delinquen*", "real spending", "pce", "layoffs"]
query = "\"consumer sentiment\" OR delinquencies"
desk = "nw-consumer"

[[theme]]
id = "saas"
name = "Agents eat seat-based software"
terms = ["saas", "seat-based", "agentic", "ai agents", "net revenue retention", "software selloff"]
query = "SaaS AI agents selloff"
desk = "nw-saas"
