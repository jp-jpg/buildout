.since-first { font-size: var(--t-sm); color: var(--ink-2); }
.checkin li { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: var(--t-sm); padding: 6px 8px; border-radius: 8px; background: var(--paper); }
.checkin li.done { background: var(--zone-good); }
.checkin li.done label { color: var(--ink-2); text-decoration: line-through; text-decoration-color: var(--muted); }
.checkin label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.checkin input { accent-color: var(--accent); margin-top: 3px; }
.checkin a { font-size: var(--t-xs); }
.streak { font: 600 var(--t-xs)/1 var(--f-mono); letter-spacing: 0.005em; padding: 5px 9px; border-radius: 999px; background: var(--paper); border: 1px solid var(--rule); color: var(--ink-2); }
.streak.on { background: var(--zone-warn); border-color: transparent; color: var(--ink); }
.nw-teaser { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.nw-tease { display: grid; gap: 6px; align-content: start; padding: 16px; border-radius: 14px; border: 1px solid var(--rule); background: var(--surface); text-decoration: none; color: var(--ink); }
.nw-tease strong { font: 600 var(--t-lg)/1.1 var(--f-display); letter-spacing: 0.01em; }
.nw-tease span:last-child { font-size: var(--t-sm); color: var(--ink-2); }
.more-link { font-size: var(--t-sm); justify-self: start; }

/* ===================== v0.6: noteworthy ===================== */
.nw-bluf { font-size: var(--t-lg); line-height: 1.5; max-width: 78ch; padding: 16px 18px; border-radius: 14px; background: var(--accent-wash); color: var(--ink); }
.nw-livebluf { display: block; margin-top: 8px; font-size: var(--t-sm); color: var(--ink-2); }
.nw-map { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; background: var(--surface); }
.nw-col { display: grid; gap: 8px; align-content: start; padding: 14px; min-width: 0; }
.nw-col + .nw-col { border-left: 1px solid var(--rule); }
.nw-col:nth-child(1) { background: color-mix(in srgb, var(--s3) 10%, transparent); }
.nw-col:nth-child(2) { background: color-mix(in srgb, var(--s3) 5%, transparent); }
.nw-col a { font-size: var(--t-sm); font-weight: 600; text-decoration: none; color: var(--ink); }
.nw-col a:hover { text-decoration: underline; }
.nw-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.nw { background: var(--surface); border: 1px solid var(--rule); border-radius: 16px; padding: 18px; display: grid; gap: 12px; align-content: start; min-width: 0; scroll-margin-top: 120px; }
.nw.hot { border-color: color-mix(in srgb, var(--s2) 60%, var(--rule)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--s2) 14%, transparent); }
.nw-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 8px 14px; }

/* ===================== v0.6: the brain (a deliberately dark "deep field" panel) ===================== */

.br-edge { transition: stroke-opacity 0.3s ease; }
.br-edge.judged { stroke-dasharray: 5 4; }
.br-edge.sel { stroke: #ffe08a !important; stroke-opacity: 0.95 !important; }
.br-hit { cursor: pointer; }
.br-node { cursor: pointer; outline: none; }
.br-node:focus-visible circle:nth-last-of-type(2) { stroke: #ffffff; stroke-width: 3; }
.br-label { fill: #ece9ff; font: 600 12px var(--f-body); paint-order: stroke; stroke: #0b0a1c; stroke-width: 3px; }
.br-val { font: 600 11px var(--f-mono); paint-order: stroke; stroke: #0b0a1c; stroke-width: 3px; }

  @keyframes brflow { to { stroke-dashoffset: -48; } }
  .br-halo { animation: brpulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

/* ===================== v0.6: buyside ===================== */

/* ---------- v0.18: Garamond type system and the reading guide ---------- */
pre, kbd, samp, .m-f, .cd-src, .cd-src *, code * { font-family: var(--f-code); font-size-adjust: none; }
table, .at-kpi b, .tile b, .num, .bd-big b, .kpi, td, th { font-variant-numeric: lining-nums tabular-nums; }
.vhead h1 { letter-spacing: -0.012em; line-height: 1.02; }
.vhead .lede { font-size: 1.22rem; line-height: 1.55; }
.eyebrow, .toc .flabel, .tabs a, .sub-label, .brand .ver { letter-spacing: 0.08em; }
.panel-title, .chart-title { font-weight: 600; }
.prose, .lede, .dguide dd, .hint { hyphens: auto; -webkit-hyphens: auto; }
em, i { font-style: italic; }
/* numbered sections: a desk reads in order */
.view { counter-reset: dsec; }
.view > .section { counter-increment: dsec; }
.view > .section > .section-head > .eyebrow::before { content: counter(dsec) "  ·  "; color: var(--accent); font-weight: 600; }
/* the desk card */
.dguide { display: grid; gap: 12px; padding: 16px 18px; border: 1px solid var(--rule); border-left: 3px solid var(--accent); border-radius: 10px; background: var(--surface); max-width: 1000px; }

.dguide-lvl.lvl-deep { background: var(--grid); color: var(--ink-2); }
.dguide-lvl.lvl-start { background: var(--accent); color: var(--surface); }
.dguide-grp { font-size: var(--t-sm); color: var(--muted); }
.dguide-map { margin-left: auto; font: 500 var(--t-sm)/1 var(--f-body); padding: 6px 11px; border-radius: 999px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink-2); cursor: pointer; }
.dguide-map:hover { border-color: var(--accent); color: var(--ink); }

.dguide-grid dd { margin: 0; color: var(--ink); line-height: 1.45; }

@media (max-width: 860px) { .dguide-grid { grid-template-columns: 1fr; } .dguide-map { margin-left: 0; } }
/* the way on */
.dnext { border-top: 1px solid var(--rule); padding-top: 22px; }
.dnext-a { display: grid; gap: 4px; max-width: 640px; padding: 16px 18px; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); text-decoration: none; color: var(--ink); }
.dnext-a:hover { border-color: var(--accent); }
.dnext-k { font: 600 0.78rem/1.2 var(--f-body); letter-spacing: 0.09em; text-transform: uppercase; color: var(--accent); }
.dnext-a b { font: 600 1.5rem/1.15 var(--f-display); }
.dnext-a b::after { content: "  →"; color: var(--accent); }

/* the map */
.sitemap { position: fixed; inset: 0; z-index: 60; background: color-mix(in srgb, var(--ink) 38%, transparent); display: grid; place-items: start center; overflow-y: auto; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.sitemap-box { width: min(1120px, 100%); margin-top: 4vh; background: var(--paper); border: 1px solid var(--rule); border-radius: 14px; padding: 22px 24px 18px; display: grid; gap: 18px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.18); }

/* ---------- v0.18: the layout. A centred navigation band in the manner of the firm and product sites (a clear
   brand at left, the five sections in the middle, the tools at right; the desks of the section as large pills on a
   second line), buttons sized to be pressed (44 pixels, pill-shaped, filled for the main action), and a floating
   bar that follows the reader down every desk with the way back, the way on and the map. ---------- */
:root { --hit: 44px; --ease: cubic-bezier(.2, .7, .2, 1); }
.topbar { background: color-mix(in srgb, var(--paper) 82%, transparent); backdrop-filter: saturate(1.4) blur(16px); -webkit-backdrop-filter: saturate(1.4) blur(16px); }
.topbar-inner { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px 20px; padding-block: 12px 10px; }
.brand { padding-bottom: 0; font: 600 1.55rem/1 var(--f-display); letter-spacing: 0.1em; gap: 12px; justify-self: start; }
.brand svg.lotus { width: 46px; height: 46px; --lotus-w: 1.6; --lotus-o: 0.7; }
.hero-mark svg.lotus { --lotus-w: 1.4; --lotus-o: 0.6; }
.vmark svg.lotus, .empty svg.lotus { --lotus-w: 3.2; --lotus-o: 0.8; }
