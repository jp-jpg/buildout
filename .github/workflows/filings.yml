name: filings-run

# The filings engine (v0.28): SEC insider data sets, XBRL company facts and daily prices for every stock that has
# been in the S&P 500. Heavy (a few GB on the first run), so weekly on Sunday and by hand; the SEC download is cached.
on:
  schedule:
    - cron: "41 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: filings-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Restore the SEC and price cache
        uses: actions/cache@v4
        with:
          path: .cache/filings
          key: filings-${{ github.run_id }}
          restore-keys: filings-

      - name: Filings engine (SEC insider data sets, company facts, prices)
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::notice::SEC_USER_AGENT variable is not set; skipping the filings engine."
            exit 0
          fi
          python -m buildout filings --ua "$SEC_USER_AGENT" --out site/data --cache .cache/filings

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/filings.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new results."
            exit 0
          fi
          git commit -m "Filings engine $(date -u +%Y-%m-%d)"
          git push
