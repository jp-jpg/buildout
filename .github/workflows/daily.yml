name: daily-run

# Runs before the US open, Tuesday to Saturday (UTC), so each run sees the prior session's close.
# Steps that need a secret or variable skip themselves cleanly until it is set.
on:
  schedule:
    - cron: "17 11 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[databento,dev]"

      - name: Test the engine
        run: pytest -q --ignore=tests/test_page.py   # page checks run in CI on every push; they never block data

      - name: Market regime (FRED, free)
        run: python -m buildout macro --out site/data

      - name: Long-history research (public datasets on GitHub, free)
        continue-on-error: true   # a dataset mirror being down must never block the market data
        run: python -m buildout research --out site/data

      - name: Brain and field-manual engine (public datasets, free)
        continue-on-error: true
        run: |
          python -m buildout brain --out site/data
          python -m buildout buyside --out site/data

      - name: Noteworthy feeds (RSS, Substack, Telegram, Reddit, HN, news; X with a token)
        continue-on-error: true   # social sources come and go; they never block the market data
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python -m buildout feeds --out site/data

      - name: Source registry
        run: python -m buildout sources --out site/data

      - name: Book run (Databento)
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
        run: |
          if [ -z "$DATABENTO_API_KEY" ]; then
            echo "::notice::DATABENTO_API_KEY is not set yet; skipping the book run."
            exit 0
          fi
          python -m buildout cost --config config.toml
          python -m buildout run --config config.toml --out site/data

      - name: Fundamentals (SEC EDGAR)
        env:
          SEC_UA: ${{ vars.SEC_USER_AGENT }}
        run: |
          if [ -z "$SEC_UA" ]; then
            echo "::notice::SEC_USER_AGENT variable is not set; skipping fundamentals."
            exit 0
          fi
          python -m buildout capex GOOGL MSFT AMZN META ORCL NVDA TSLA CRWV SPCX --ua "$SEC_UA" --json site/data/capex.json

      - name: The atlas (every monthly series, FRED and GitHub mirrors; learned structure)
        continue-on-error: true
        run: python -m buildout atlas --out site/data

      - name: The labs (156 years of public data; trend, oscillators, valuation, regimes, volatility, spreads)
        continue-on-error: true
        run: python -m buildout labs --out site/data

      - name: Machine-learning lab (purged walk-forward, CPCV, conformal intervals, analogs)
        continue-on-error: true
        run: python -m buildout ml --out site/data

      - name: Reality check (every model's assumptions, breakpoints, kappa, fragility, stressed worlds)
        continue-on-error: true
        run: python -m buildout reality --out site/data

      - name: Reasoner and games (reads the files above; no network)
        continue-on-error: true
        run: python -m buildout reason --out site/data

      - name: Decision engines and the manifest (valuation, causal statistics, hedge book, decision loop; no network)
        continue-on-error: true
        run: python -m buildout engine --out site/data --only valuation,causal,hedges,ooda

      - name: Status (freshness and sanity checks for the page)
        if: always()
        run: python -m buildout status --out site/data

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No new data."
            exit 0
          fi
          git commit -m "Daily data $(date -u +%Y-%m-%d)"
          git push
