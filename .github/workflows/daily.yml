name: daily-run

# Runs before the US open, Tuesday to Saturday (UTC), so each run sees the prior session's close.
# Steps that need a secret or variable skip themselves cleanly until it is set.
on:
  schedule:
    - cron: "17 11 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[databento,dev]"

      - name: Test the engine
        run: pytest -q --ignore=tests/test_page.py   # page checks run in CI on every push; they never block data

      - name: Market regime (FRED, free)
        run: python -m buildout macro --out site/data

      - name: Book run (Databento)
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
        run: |
          if [ -z "$DATABENTO_API_KEY" ]; then
            echo "::notice::DATABENTO_API_KEY is not set yet; skipping the book run."
            exit 0
          fi
          python -m buildout cost --config config.toml
          python -m buildout run --config config.toml --out site/data

      - name: Fundamentals (SEC EDGAR)
        env:
          SEC_UA: ${{ vars.SEC_USER_AGENT }}
        run: |
          if [ -z "$SEC_UA" ]; then
            echo "::notice::SEC_USER_AGENT variable is not set; skipping fundamentals."
            exit 0
          fi
          python -m buildout capex GOOGL MSFT AMZN META ORCL TSLA SPCX --ua "$SEC_UA" --json site/data/capex.json

      - name: Status (freshness and sanity checks for the page)
        if: always()
        run: python -m buildout status --out site/data

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No new data."
            exit 0
          fi
          git commit -m "Daily data $(date -u +%Y-%m-%d)"
          git push
