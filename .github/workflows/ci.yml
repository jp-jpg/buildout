name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Page is assembled from site/src
        run: python scripts/assemble_page.py --check
      - name: Test (engine, page math against the engine, robustness)
        run: pytest -q
