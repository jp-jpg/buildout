name: futures-run

# The futures engine (v0.29): CME Globex daily bars for 39 futures markets from Databento (2010 to now, about a dollar
# or two; the run refuses a pull estimated above $5) and hedgers' positions from the CFTC. Weekly on Saturday and by
# hand. The pysystemtrade run (the long record to March 2024) needs no key and ships with the page.
on:
  schedule:
    - cron: "23 7 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: futures-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[databento,dev]"

      - name: Futures engine (Databento bars and definitions, CFTC positions)
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
        run: |
          if [ -z "$DATABENTO_API_KEY" ]; then
            echo "::notice::DATABENTO_API_KEY secret is not set; skipping the futures engine."
            exit 0
          fi
          python -m buildout futures --source databento --out site/data --cache .cache/futures

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/futures.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new results."
            exit 0
          fi
          git commit -m "Futures engine $(date -u +%Y-%m-%d)"
          git push
