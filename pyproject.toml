[project]
name = "buildout"
version = "0.30.0"
description = "Regime-aware risk, hedge and sizing engine for a concentrated AI-buildout equity book."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pandas>=2.2", "scipy>=1.10", "pyarrow>=14", "scikit-learn>=1.3"]

[project.optional-dependencies]
databento = ["databento>=0.40"]
dev = ["pytest>=7", "hypothesis>=6.100"]

[project.scripts]
buildout = "buildout.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["buildout*"]

[tool.setuptools.package-data]
buildout = ["assets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "E731", "E741", "E702", "E402", "B007", "B008", "B023", "B904", "B905"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["buildout/core"]
